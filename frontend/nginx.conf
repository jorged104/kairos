server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Docker's DNS: resolve "api" per request so nginx starts even if the API
    # is not up yet and follows the container when it is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    # The client IP comes from X-Forwarded-For as seen through the private
    # networks of the proxy chain (Cloudflare tunnel → Traefik → here); the
    # API reads it from X-Real-IP for the login rate limit (spec 003).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        # The OIDC callback may wait up to 5 s for the IdP.
        proxy_read_timeout 30s;
    }

    location = /ws {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location /health/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
