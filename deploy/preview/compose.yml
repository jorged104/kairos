# Entorno de previsualización (spec 002). Se usa solo a través de deploy.sh:
#   docker compose -p kairos-preview -f deploy/preview/compose.yml --env-file ~/kairos/preview.env ...
# TAG (SHA corto del commit) lo exporta deploy.sh. Ningún servicio publica puertos en el host.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    image: kairos-migrate:${TAG:?}
    build:
      context: ../../backend
      target: migrate
    environment:
      GOOSE_DBSTRING: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - deploy

  api:
    image: kairos-api:${TAG:?}
    build:
      context: ../../backend
      target: api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      API_PORT: "8080"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      traefik.enable: "false"

  web:
    image: kairos-web:${TAG:?}
    build:
      context: ../../frontend
      target: prod
    networks:
      - internal
      - traefik
    depends_on:
      - api
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?}
      traefik.http.routers.kairos-preview.rule: Host(`${PREVIEW_HOST:?}`)
      traefik.http.routers.kairos-preview.entrypoints: ${TRAEFIK_ENTRYPOINT:?}
      traefik.http.services.kairos-preview.loadbalancer.server.port: "80"

networks:
  internal: {}
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:?}

volumes:
  pgdata: {}
