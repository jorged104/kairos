services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build:
      context: ./backend
      target: api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      API_PORT: "8080"
      AUTH_MODE: ${AUTH_MODE}
      SESSION_SECRET: ${SESSION_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      DEFAULT_ROLE: ${DEFAULT_ROLE-member}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      TRUST_PROXY: "true"
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      # Dentro de la red de Compose la API ve a Keycloak por su nombre de servicio.
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL_CONTAINER:-http://keycloak:8080/realms/kairos}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_ROLE_SOURCE: ${OIDC_ROLE_SOURCE:-idp}
      OIDC_LINK_BY_EMAIL: ${OIDC_LINK_BY_EMAIL:-false}
      # Archivos de las páginas (spec 005): vacío = en la BD. make up-s3 los manda a SeaweedFS.
      FILES_S3_ENDPOINT: ${FILES_S3_ENDPOINT_CONTAINER:-}
      FILES_S3_BUCKET: ${FILES_S3_BUCKET:-}
      FILES_S3_ACCESS_KEY: ${FILES_S3_ACCESS_KEY:-}
      FILES_S3_SECRET_KEY: ${FILES_S3_SECRET_KEY:-}
      FILES_S3_USE_SSL: ${FILES_S3_USE_SSL:-false}
    ports:
      - "${API_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      API_PROXY_TARGET: http://api:8080
      WEB_PORT: "5173"
    ports:
      - "${WEB_PORT}:5173"
    depends_on:
      - api

  # IdP de prueba (spec 003). Solo con el profile sso: make up-sso.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    profiles: [sso]
    command: ["start-dev", "--import-realm"]
    environment:
      # Solo desarrollo.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # El navegador ve a Keycloak en localhost:8180 (el issuer de los tokens);
      # la API en contenedor lo alcanza por keycloak:8080.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./scripts/keycloak:/opt/keycloak/data/import:ro

  # Almacenamiento compatible con S3 para los archivos de las páginas (spec 005).
  # Solo con el profile s3: make up-s3. Credenciales en scripts/seaweedfs/s3.json.
  s3:
    image: chrislusf/seaweedfs:4.48
    profiles: [s3]
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - ./scripts/seaweedfs:/etc/seaweedfs:ro
      - s3data:/data

volumes:
  pgdata:
  s3data:
