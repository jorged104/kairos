[project]
name = "kairos-agent"
version = "0.1.0"
description = "Agente de informes de Kairos (spec 020, ADR 0004): escribe informes de proyecto con deepagents."
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.7.34",
    "langchain-openai==1.7.4",
    "starlette>=0.47,<1",
    "uvicorn>=0.35,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
